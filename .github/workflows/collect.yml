name: Collect SPX GEX

# GitHub's every-5-min cron is unreliable (delayed/skipped). So instead we start
# ONE long-running job near the open and loop internally: collect every 5 minutes
# until the market closes. GitHub only has to launch it once per session.
on:
  schedule:
    - cron: "31 13 * * 1-5"   # ~9:31 ET during EDT (Mar–Nov)
    - cron: "31 14 * * 1-5"   # ~9:31 ET during EST (Nov–Mar); also covers the tail via the queue
  workflow_dispatch: {}        # run manually any time (e.g. mid-session to start now)

permissions:
  contents: write

concurrency:
  group: collect-loop
  cancel-in-progress: false     # a second trigger queues and picks up where the first ends

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # under GitHub's 6h job cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collect every 5 minutes through the session
        run: |
          git config user.name "gex-collector"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 72); do
            python collect_gex.py || true
            git add data/collected/
            if ! git diff --cached --quiet; then
              git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase --autostash origin main || true
              git push -q || true
              echo "tick $i: committed"
            else
              echo "tick $i: no data (market closed/thin)"
            fi
            # stop once the US session is over (>= 16:00 ET)
            python -c "import collect_gex as c,sys; t=c.now_et(); sys.exit(1 if (t.hour*60+t.minute)>=960 else 0)" || { echo "market closed — exiting"; break; }
            sleep 300
          done
