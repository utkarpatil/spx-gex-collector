name: Collect SPX GEX

# Runs the collector on GitHub's servers — no laptop needed.
# Cron is in UTC. 13:00–21:59 UTC Mon–Fri covers US market hours in both EDT & EST;
# the script itself only writes during 9:30–16:00 ET, so off-hours ticks do nothing.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}          # lets you run it manually from the Actions tab

permissions:
  contents: write                # allow committing the data back

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect one tick
        run: python collect_gex.py

      - name: Commit data if any
        run: |
          git config user.name "gex-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/collected/
          if git diff --cached --quiet; then
            echo "No new data (market closed or thin read) — nothing to commit."
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
